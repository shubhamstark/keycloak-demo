# recommendation-service: pure resource server, downstream target.
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: keycloak-demo
spec:
  selector: { app: recommendation-service }
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: keycloak-demo
spec:
  replicas: 1
  selector: { matchLabels: { app: recommendation-service } }
  template:
    metadata:
      labels: { app: recommendation-service }
    spec:
      containers:
        - name: recommendation-service
          image: recommendation-service:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: OIDC_ISSUER
              value: http://keycloak.demo.local/realms/demo
            - name: OIDC_AUDIENCE
              value: recommendation-service
            - name: PORT
              value: "8081"
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 10
