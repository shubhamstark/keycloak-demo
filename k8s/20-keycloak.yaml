# Keycloak: the authorization server and OIDC provider.
# Quarkus distribution, pinned to 26.3. Started in dev-friendly mode with the
# realm auto-imported from a mounted ConfigMap. Standard Token Exchange V2 is on
# by default in 26.2+, so no build-time feature flags are needed here.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak-demo
spec:
  selector: { app: keycloak }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak-demo
spec:
  # Two replicas would demonstrate clustering (Infinispan via DNS_PING). We keep
  # one here for a simpler local bring-up; see docs/RUNNING.md to scale up.
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: demo-secrets, key: POSTGRES_PASSWORD } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: demo-secrets, key: KC_BOOTSTRAP_ADMIN_USERNAME } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: demo-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD } }
            # Behind an ingress; tell Keycloak its external URL so issuer and
            # redirect handling use the hostname the browser sees.
            - name: KC_HOSTNAME
              value: http://keycloak.demo.local
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # Force realm re-import on every restart so config changes apply.
            - name: KC_SPI_IMPORT_STRATEGY
              value: OVERWRITE_EXISTING
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet: { path: /realms/demo, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
