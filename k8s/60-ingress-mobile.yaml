# login-mobile ingress: serves at app.demo.local/mobile. The rewrite
# strips /mobile before forwarding so the nginx pod sees /index.html
# instead of /mobile/index.html.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress-mobile
  namespace: keycloak-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: app.demo.local
      http:
        paths:
          - path: /mobile(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: login-mobile, port: { number: 80 } } }
