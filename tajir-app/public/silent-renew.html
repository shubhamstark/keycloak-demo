<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <script src="/oidc-client-ts.js"></script>
  <script>
    // silent-renew.html — used by oidc-client-ts for iframe-based token refresh.
    // The library loads this in a hidden iframe to call the authorization endpoint
    // with prompt=none, which returns a new token without user interaction if
    // the Keycloak session is still valid. For token-based auth (no sessions),
    // this may fall back to a redirect — handle gracefully.
    new Oidc.UserManager().signinSilentCallback().catch(function(err) {
      console.error('Silent renew failed:', err);
    });
  </script>
</body>
</html>
