# Main ingress: keycloak, login-web, and music-service. No path rewrites.
# login-mobile has its own ingress (60-ingress-mobile.yaml) because its
# /mobile path needs rewrite-target.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: keycloak-demo
spec:
  ingressClassName: nginx
  rules:
    - host: keycloak.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 80 } } }
    - host: app.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: login-web, port: { number: 80 } } }
    - host: music.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: music-service, port: { number: 80 } } }
