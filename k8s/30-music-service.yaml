# music-service: resource server for the user, and a client to the downstream.
apiVersion: v1
kind: Service
metadata:
  name: music-service
  namespace: keycloak-demo
spec:
  selector: { app: music-service }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-service
  namespace: keycloak-demo
spec:
  replicas: 1
  selector: { matchLabels: { app: music-service } }
  template:
    metadata:
      labels: { app: music-service }
    spec:
      containers:
        - name: music-service
          image: music-service:demo
          imagePullPolicy: IfNotPresent
          env:
            # Issuer as seen from inside the cluster AND the browser must match
            # the token's iss. We use the ingress hostname everywhere so tokens
            # validate consistently. See docs/RUNNING.md for the /etc/hosts note.
            - name: OIDC_ISSUER
              value: http://keycloak.demo.local/realms/demo
            - name: OIDC_AUDIENCE
              value: music-service
            - name: OIDC_TOKEN_ENDPOINT
              value: http://keycloak.demo.local/realms/demo/protocol/openid-connect/token
            - name: CLIENT_ID
              value: music-service
            - name: CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: demo-secrets, key: MUSIC_CLIENT_SECRET } }
            - name: RECOMMENDATION_URL
              value: http://recommendation-service
            - name: RECOMMENDATION_AUDIENCE
              value: recommendation-service
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
