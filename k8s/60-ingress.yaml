# Main ingress: keycloak, tajir-app (React SPA), dashboard-service API,
# and admin-service. No path rewrites needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: keycloak-demo
spec:
  ingressClassName: nginx
  rules:
    - host: keycloak.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 80 } } }
    - host: app.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: tajir-app, port: { number: 80 } } }
    - host: api.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard-service, port: { number: 80 } } }
    - host: admin.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-service, port: { number: 80 } } }
