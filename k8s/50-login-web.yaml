# login-web: the SPA public client, served as static files by nginx.
apiVersion: v1
kind: Service
metadata:
  name: login-web
  namespace: keycloak-demo
spec:
  selector: { app: login-web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-web
  namespace: keycloak-demo
spec:
  replicas: 1
  selector: { matchLabels: { app: login-web } }
  template:
    metadata:
      labels: { app: login-web }
    spec:
      containers:
        - name: login-web
          image: login-web:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
