# DEMO SECRETS ONLY. These values are fake and committed on purpose so the demo
# is reproducible. Never put a real credential here. In production these come
# from a secret manager, not git.
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
  namespace: keycloak-demo
type: Opaque
stringData:
  # Postgres
  POSTGRES_PASSWORD: "demo-postgres-password"
  # Keycloak admin bootstrap
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  # music-service client secret (matches keycloak/realm-export.json)
  MUSIC_CLIENT_SECRET: "music-service-demo-secret"
